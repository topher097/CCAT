[project]
name = "ccat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "topher097", email = "cmendres400@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "opencode-python-sdk>=0.2.3",
    "polars>=2.1.0",
    "pydantic>=2.14.3",
    "fire>=0.7.0",
    "requests>=2.32.0",
    "pandera[polars]>=0.36.0",
    "openpyxl>=3.1.5",
    "fastexcel>=0.21.0",
    "py3o-template>=0.10.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",
    "pypdf>=5.0.0",
    "jinja2>=3.1.0",
    "xhtml2pdf>=0.2.16",
]

[project.scripts]
ccat = "ccat:main"
gdrive = "ccat.gdrive:cli"
zite = "ccat.zite:cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
