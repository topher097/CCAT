[project]
name = "ccat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "topher097", email = "cmendres400@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "opencode-python-sdk>=0.2.3",
    "polars>=2.1.0",
    "pydantic>=2.14.3",
    "fire>=0.7.0",
    "requests>=2.32.0",
    "pandera[polars]>=0.36.0",
    "openpyxl>=3.1.5",
    "fastexcel>=0.21.0",
    "py3o-template>=0.10.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",
    "pypdf>=5.0.0",
    "jinja2>=3.1.0",
    "xhtml2pdf>=0.2.16",
    "nicegui>=4.0.0",
    "dnspython>=2.9.2",
    "email-validator>=2.4.0",
    "zerobouncesdk>=3.2.0",
]

[project.scripts]
ccat = "ccat:main"
gdrive = "ccat.gdrive:cli"
zite = "ccat.zite:cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ty.src]
include = ["src", "scripts", "test"]

# The bulk script imports its sibling via sys.path manipulation, which ty
# cannot statically resolve.
[[tool.ty.overrides]]
include = ["scripts/zerobounce_bulk_check.py"]
rules = { unresolved-import = "ignore" }

# The screening stage imports the ZeroBounce/Nominatim engines from
# scripts/ via sys.path manipulation at runtime; ty cannot statically
# resolve those imports.
[[tool.ty.overrides]]
include = ["src/ccat/screening.py"]
rules = { unresolved-import = "ignore" }

# Test files import sibling modules flat (pytest inserts test/ on sys.path);
# ty resolves first-party only from src/, so these cannot be resolved.
[[tool.ty.overrides]]
include = [
    "scripts/audit_ui_smoke.py",
    "test/test_audit_migrate.py",
    "test/test_audit_server.py",
]
rules = { unresolved-import = "ignore" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
