[project]
name = "ccat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "topher097", email = "cmendres400@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "opencode-python-sdk>=0.2.3",
    "polars>=2.1.0",
    "pydantic>=2.14.3",
    "fire>=0.7.0",
    "requests>=2.32.0",
    "pandera[polars]>=0.36.0",
    "openpyxl>=3.1.5",
    "fastexcel>=0.21.0",
    "py3o-template>=0.10.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",
    "pypdf>=5.0.0",
    "jinja2>=3.1.0",
    "xhtml2pdf>=0.2.16",
    "dnspython>=2.9.2",
    "email-validator>=2.4.0",
    "zerobouncesdk>=3.2.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "fastapi>=0.163.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ccat = "ccat:main"
gdrive = "ccat.gdrive:cli"
zite = "ccat.zite:cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ty.src]
include = ["src", "scripts", "test"]

# Test files import sibling modules flat (pytest inserts test/ on sys.path);
# ty resolves first-party only from src/, so these cannot be resolved.
[[tool.ty.overrides]]
include = [
    "test/test_api.py",
    "test/test_audit_migrate.py",
    "test/test_config_api.py",
    "test/test_consolidate.py",
    "test/test_db_clarify.py",
    "test/test_db_console.py",
    "test/test_db_generate.py",
    "test/test_db_import.py",
    "test/test_db_dispatch.py",
    "test/test_db_pipeline.py",
    "test/test_db_repo.py",
    "test/test_db_stats.py",
    "test/test_duplications.py",
    "test/test_jobs.py",
    "test/test_manual_match.py",
    "test/test_mail.py",
    "test/test_remediation.py",
    "test/test_services.py",
    "test/test_sponsor_claims.py",
]
rules = { import-not-found = "ignore" }

[tool.pytest.ini_options]
# Every pytest run is parallel: pytest-xdist spreads tests over worker
# processes (`-n auto` = one worker per available CPU).  Kept in addopts so
# plain `pytest`, `just test`, pre-commit and agents all get it for free.
# Override the worker count on the command line, e.g. `pytest -n 4`.
addopts = "-n auto"
# API tests are async (pytest-asyncio auto-detects tests + async
# fixtures).  Every other suite is synchronous (asyncio.run inside the
# test body) and unaffected.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-xdist>=3.6",
]
