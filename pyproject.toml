[project]
name = "ccat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "topher097", email = "cmendres400@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "opencode-python-sdk>=0.2.3",
    "polars>=2.1.0",
    "pydantic>=2.14.3",
    "fire>=0.7.0",
    "requests>=2.32.0",
    "pandera[polars]>=0.36.0",
    "openpyxl>=3.1.5",
    "fastexcel>=0.21.0",
    "py3o-template>=0.10.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",
    "pypdf>=5.0.0",
    "jinja2>=3.1.0",
    "xhtml2pdf>=0.2.16",
    "nicegui>=4.0.0",
    "dnspython>=2.9.2",
    "email-validator>=2.4.0",
    "zerobouncesdk>=3.2.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
]

[project.scripts]
ccat = "ccat:main"
gdrive = "ccat.gdrive:cli"
zite = "ccat.zite:cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ty.src]
include = ["src", "scripts", "test"]

# Test files import sibling modules flat (pytest inserts test/ on sys.path);
# ty resolves first-party only from src/, so these cannot be resolved.
[[tool.ty.overrides]]
include = [
    "scripts/audit_ui_smoke.py",
    "test/test_audit_migrate.py",
    "test/test_audit_server.py",
    "test/test_consolidate.py",
    "test/test_db_clarify.py",
    "test/test_db_generate.py",
    "test/test_db_import.py",
    "test/test_db_pipeline.py",
    "test/test_db_repo.py",
    "test/test_db_stats.py",
    "test/test_jobs.py",
    "test/test_remediation.py",
    "test/test_services.py",
]
rules = { unresolved-import = "ignore" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
