# CCAT deployment (plan §13).
#
#   docker compose --profile prod up -d --build   # production shape
#   docker compose --profile dev  up --build      # live-reload shape
#
# Secrets come from the environment (compose interpolates the shell env, fed
# by .envrc / .envrc.private); no secret is stored in this file and none is
# passed as a build arg.  See docs/deployment.md.
name: ccat

x-app-env: &app-env
  CCAT_CONFIG: /app/config/ccat_docker.json
  CCAT_DB_DIR: /data
  CCAT_RUN_MIGRATIONS: "0"
  TZ: ${TZ:-America/Detroit}
  ZITE_API_KEY: ${ZITE_API_KEY:-}
  ZEROBOUNCE_API_KEY: ${ZEROBOUNCE_API_KEY:-}
  CCAT_SESSION_SECRET: ${CCAT_SESSION_SECRET:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  # AI screening (module 2) and clarify (module 7) drive the opencode
  # service below; the CCAT image ships no opencode CLI, so the server
  # is the only LLM path in Docker.
  OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-http://opencode:4097}
  OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}

# State lives on named volumes; the repo config file is a read-only seed
# and the templates are read-only bind mounts.
# The SQLite volume (ccat-db) must stay on local disk, never NFS.
x-app-volumes: &app-volumes
  - ccat-db:/data
  - ccat-artifacts:/artifacts
  - ccat-logs:/logs
  # The live config is a regular file on a writable volume: the admin
  # Settings tab rewrites it (a rename onto a bind mount fails with
  # EBUSY), and api/worker/db-upgrade share the same file.
  - ccat-config:/app/config
  # The repo file is the seed; the entrypoint applies it when it is newer
  # than the live copy.
  - ./config/ccat_docker.json:/app/config-seed/ccat_docker.json:ro
  # Gmail OAuth inputs stay read-only. The token is copied into the writable
  # ccat-config volume before sending; refresh uses an atomic rename there.
  - ${CCAT_GOOGLE_CLIENT_FILE:-./ccat_google_credentials.json}:/app/config-seed/ccat_google_credentials.json:ro
  - ${CCAT_GMAIL_TOKEN_FILE:-./ccat_google_gmail_token.json}:/app/config-seed/ccat_google_gmail_token.json:ro
  - ./data:/app/data:ro

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-image: &app-image
  image: ccat:${CCAT_IMAGE_TAG:-local}
  build:
    context: .
    target: runtime

services:
  # ------------------------------------------------------------------ prod
  api:
    <<: *app-image
    profiles: ["prod"]
    command:
      - uvicorn
      - ccat.api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8650"
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      db-upgrade:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8650/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging: *logging

  # Same image, no reload: jobs must not be interrupted by a code swap.
  worker:
    <<: *app-image
    profiles: ["prod", "dev"]
    command: ["ccat", "worker", "--config", "/app/config/ccat_docker.json"]
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      db-upgrade:
        condition: service_completed_successfully
      # Screening jobs need the LLM server; wait until it answers.
      opencode:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 150s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    logging: *logging

  # Headless opencode server (the LLM behind AI screening and the clarify
  # writer).  The image is built from https://github.com/roborew/opencode-server;
  # its entrypoint drops to OPENCODE_UID/GID, so the credential copy below has
  # to happen first (that step still runs as root).
  opencode:
    build:
      context: https://github.com/roborew/opencode-server.git#main
      args:
        CONFIG_REPO: ${OPENCODE_CONFIG_REPO:-https://github.com/roborew/opencode-config-v2.git}
        CONFIG_REF: ${OPENCODE_CONFIG_REF:-main}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.3.0}
    image: ccat-opencode:${CCAT_IMAGE_TAG:-local}
    profiles: ["prod", "dev"]
    working_dir: /home/opencode
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # The host credential file is mode 600 and owned by the host user, so
        # only root can read it here.  Copy it into the container's own store
        # before the upstream entrypoint drops privileges.
        if [[ -f /run/opencode-auth.json ]]; then
          install -m 600 -o "${OPENCODE_UID:-1000}" -g "${OPENCODE_GID:-1000}" \
            /run/opencode-auth.json /var/lib/opencode-data/auth.json
        fi
        exec /usr/local/bin/opencode-entrypoint.sh opencode serve \
          --hostname 0.0.0.0 --port 4097
    environment:
      OPENCODE_UID: ${OPENCODE_UID:-1000}
      OPENCODE_GID: ${OPENCODE_GID:-1000}
      # Basic auth for the server; the SDK client reads the same variable.
      # Empty -> opencode generates a random password nobody knows, so set it.
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      XDG_DATA_HOME: /var/opencode-xdg
      OPENCODE_CONTAINER_XDG: /var/opencode-xdg
    volumes:
      - opencode-data:/var/lib/opencode-data
      # Host opencode credentials (provider API keys), copied in on start.
      - ${OPENCODE_AUTH_FILE:-${HOME}/.local/share/opencode/auth.json}:/run/opencode-auth.json:ro
    healthcheck:
      # 401 = the server is up and asking for the basic-auth password.
      test: ["CMD-SHELL", "status=$$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:4097/api/info || true); test \"$$status\" = 401 -o \"$$status\" = 200"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    logging: *logging

  # Controlled one-shot migration.  api/worker wait for it to exit 0 so two
  # replicas never race the schema (plan §13).
  db-upgrade:
    <<: *app-image
    profiles: ["prod", "dev"]
    command: ["ccat", "db-upgrade", "--config", "/app/config/ccat_docker.json"]
    environment: *app-env
    volumes: *app-volumes
    restart: "no"
    logging: *logging

  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CCAT_DOMAIN: ${CCAT_DOMAIN:-localhost}
      # Empty/unset -> "internal" so Caddy's local CA is used and the
      # Caddyfile's `tls` directive always gets an argument.
      CCAT_ACME_EMAIL: ${CCAT_ACME_EMAIL:-internal}
      # Extra site names (tailnet IP / MagicDNS URL) served with the
      # internal CA so other tailnet machines can reach the app.
      CCAT_TAILSCALE_HOSTS: ${CCAT_TAILSCALE_HOSTS:-topher-laptop.tail8dc3e.ts.net, 100.112.162.55}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Build the SPA first: `cd frontend && npm ci && npm run build`.
      - ./frontend/dist:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # ------------------------------------------------------------------- dev
  api-dev:
    <<: *app-image
    profiles: ["dev"]
    command:
      - uvicorn
      - ccat.api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8650"
      - --reload
      - --reload-dir
      - /app/src
    environment:
      <<: *app-env
      PYTHONPATH: /app/src
    volumes:
      - ccat-db:/data
      - ccat-artifacts:/artifacts
      - ccat-logs:/logs
      # Same shape as prod: the live config is a writable volume file
      # (the admin Settings tab saves here), seeded from the repo file.
      - ccat-config:/app/config
      - ./config/ccat_docker.json:/app/config-seed/ccat_docker.json:ro
      - ${CCAT_GOOGLE_CLIENT_FILE:-./ccat_google_credentials.json}:/app/config-seed/ccat_google_credentials.json:ro
      - ${CCAT_GMAIL_TOKEN_FILE:-./ccat_google_gmail_token.json}:/app/config-seed/ccat_google_gmail_token.json:ro
      - ./data:/app/data:ro
      - ./src:/app/src:ro
    depends_on:
      db-upgrade:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8650/api/v1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  # Vite dev server with HMR; Caddy keeps it same-origin with the API.
  web:
    image: node:24-alpine
    profiles: ["dev"]
    working_dir: /app/frontend
    command:
      - sh
      - -c
      - npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app/frontend
      # Container-only node_modules: the host tree keeps its own glibc
      # install (vitest), so the image's musl binaries never land here.
      - /app/frontend/node_modules
    restart: unless-stopped
    logging: *logging

  caddy-dev:
    image: caddy:2-alpine
    profiles: ["dev"]
    ports:
      - "8443:8443"
    environment:
      CCAT_DEV_DOMAIN: ${CCAT_DEV_DOMAIN:-localhost}
      # Tailnet names, each with an explicit :8443 port (Caddyfile.dev).
      CCAT_DEV_TAILSCALE_HOSTS: ${CCAT_DEV_TAILSCALE_HOSTS:-topher-laptop.tail8dc3e.ts.net:8443, 100.112.162.55:8443}
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api-dev
      - web
    restart: unless-stopped
    logging: *logging

volumes:
  ccat-db:
  ccat-artifacts:
  ccat-logs:
  ccat-config:
  caddy-data:
  caddy-config:
  opencode-data:
