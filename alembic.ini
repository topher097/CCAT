# Minimal Alembic configuration for the CCAT SQLite database.
#
# Migrations run SYNC (see alembic/env.py); the async runtime engine
# derives its URL from config storage.database_url.  CCAT_DATABASE_URL
# (sync or async spelling) overrides the URL below when set.

[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///./output/ccat.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
